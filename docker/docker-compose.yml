services:
  postgres:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 2s
      retries: 5

  migrations:
    build:
      context: ../
      dockerfile: docker/Dockerfile.migrations
    environment:
      - LIQUIBASE_COMMAND_URL=${JDBC_POSTGRES_URL}
      - LIQUIBASE_COMMAND_USERNAME=${POSTGRES_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${POSTGRES_PASSWORD}
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=${LIQUIBASE_CHANGELOG}
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}

#      - KC_HOSTNAME=localhost
#      - KC_HOSTNAME_PORT=9090
#      - KC_HOSTNAME_STRICT=false
#      - KC_HOSTNAME_STRICT_HTTPS=false
#      - KC_HTTP_ENABLED=true
#      - KC_PROXY=edge
    ports:
      - "9090:8080"
    volumes:
      - ../keycloak/:/opt/keycloak/data/import/
    command: ["start-dev", "--import-realm", "--verbose"]

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile.application
    ports:
      - "8080:8080"
    volumes:
      - ../:/app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JDBC_POSTGRES_URL=${JDBC_POSTGRES_URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
#      keycloak:
#        condition: service_completed_successfully