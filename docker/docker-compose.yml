services:
  order-postgres:
    image: postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_ORDER_DB}
      - POSTGRES_USER=${POSTGRES_ORDER_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ORDER_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_ORDER_DB} -U ${POSTGRES_ORDER_USER}" ]
      interval: 5s
      timeout: 2s
      retries: 5

  storage-postgres:
    image: postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_STORAGE_DB}
      - POSTGRES_USER=${POSTGRES_STORAGE_USER}
      - POSTGRES_PASSWORD=${POSTGRES_STORAGE_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_STORAGE_DB} -U ${POSTGRES_STORAGE_USER}" ]
      interval: 5s
      timeout: 2s
      retries: 5

  order-migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    volumes:
      - ../orderService/liquibase:/liquibase/workspace
    environment:
      - LIQUIBASE_COMMAND_URL=${JDBC_ORDER_POSTGRES_URL}
      - LIQUIBASE_COMMAND_USERNAME=${POSTGRES_ORDER_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${POSTGRES_ORDER_PASSWORD}
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=${LIQUIBASE_CHANGELOG}
    depends_on:
      order-postgres:
        condition: service_healthy

  storage-migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    volumes:
      - ../storageService/liquibase:/liquibase/workspace
    environment:
      - LIQUIBASE_COMMAND_URL=${JDBC_STORAGE_POSTGRES_URL}
      - LIQUIBASE_COMMAND_USERNAME=${POSTGRES_STORAGE_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${POSTGRES_STORAGE_PASSWORD}
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=${LIQUIBASE_CHANGELOG}
    depends_on:
      storage-postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  kafka-init:
    image: apache/kafka:latest
    entrypoint: [ "/bin/sh", "/workspace/kafka-init.sh" ]
    volumes:
      - ../kafka/:/workspace/
    depends_on:
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_ENABLED=true
    ports:
      - "9090:8080"
    volumes:
      - ../keycloak/:/opt/keycloak/data/import/
    command: ["start-dev", "--import-realm", "--verbose"]

  application-build:
    build:
      context: .
      dockerfile: Dockerfile.application
    volumes:
      - ../:/app
      - gradle-cache:/home/gradle/.gradle
    environment:
      - GRADLE_USER_HOME=/home/gradle/.gradle

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.orderservice
    ports:
      - "8081:8080"
    volumes:
      - ../:/app
    environment:
      - POSTGRES_USER=${POSTGRES_ORDER_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ORDER_PASSWORD}
      - JDBC_POSTGRES_URL=${JDBC_ORDER_POSTGRES_URL}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - GRADLE_USER_HOME=/tmp/gradle-cache
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      application-build:
        condition: service_completed_successfully
      order-postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully

  storage-service:
    build:
      context: .
      dockerfile: Dockerfile.storageservice
    ports:
      - "8082:8080"
    volumes:
      - ../:/app
    environment:
      - POSTGRES_USER=${POSTGRES_STORAGE_USER}
      - POSTGRES_PASSWORD=${POSTGRES_STORAGE_PASSWORD}
      - JDBC_POSTGRES_URL=${JDBC_STORAGE_POSTGRES_URL}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - GRADLE_USER_HOME=/tmp/gradle-cache
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      application-build:
        condition: service_completed_successfully
      storage-postgres:
        condition: service_healthy
      storage-migrations:
        condition: service_completed_successfully
volumes:
  gradle-cache: